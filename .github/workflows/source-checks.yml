name: Source checks

on:
  push:
  pull_request:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install linter
        run: python -m pip install 'ruff==0.17.3'
      - name: Lint
        run: ruff check src scripts tests
      - name: Compile Python sources
        run: python -m compileall -q src scripts tests
      - name: Verify public identifiers and paths
        run: python scripts/audit_release.py
      - name: Test release audit regressions
        run: python -m unittest discover -s tests -p test_release_audit.py
