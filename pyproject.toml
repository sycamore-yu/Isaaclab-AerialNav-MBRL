[build-system]
requires = ["uv_build>=0.12.6,<0.13"]
build-backend = "uv_build"

[project]
name = "isaaclab_navrl"
version = "0.1.0"
description = "NavRL, Zhang and PointNet navigation with Isaac Lab 3.0 Newton/MJWarp and Warp."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["isaaclab[rsl-rl]==3.0.0", "tensorboard>=2.21", "pyyaml>=6.0"]

[project.optional-dependencies]
recording = ["rerun-sdk==0.30.0"]

[project.entry-points."isaaclab.tasks"]
isaaclab_navrl = "isaaclab_navrl.tasks"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.11"]

[tool.uv]
index-strategy = "unsafe-best-match"
prerelease = "allow"
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
override-dependencies = [
  "numpy>=2", "mujoco~=3.12.0", "mujoco-warp~=3.12.0", "newton[sim]==1.6.1",
  "newton-usd-schemas>=0.5.0", "usd-exchange==3.0.1", "usd-optimize~=1.3.1",
  "torch==2.11.0", "torchvision==0.26.0", "fsspec>=2026.6.0",
  "packaging>=20,<27", "urllib3>=2.8.0",
]

[tool.uv.sources]
isaaclab = { index = "nvidia" }
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[tool.uv.build-backend]
module-name = "isaaclab_navrl"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: launches the Newton simulator"]

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"
explicit = false

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
