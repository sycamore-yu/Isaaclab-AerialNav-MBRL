[build-system]
requires = ["uv_build>=0.12.6,<0.13"]
build-backend = "uv_build"

[project]
name = "aerialnav"
version = "0.1.0"
description = "Depth-based quadrotor navigation with differentiable BPTT training in Isaac Lab 3."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE", "licenses/*.txt"]
requires-python = ">=3.12,<3.13"
dependencies = ["isaaclab[isaacsim,rsl-rl]==3.0.0", "tensorboard>=2.21", "pyyaml>=6.0"]

[project.optional-dependencies]
curobo = ["nvidia-curobo[cu13]"]

[project.entry-points."isaaclab.tasks"]
aerialnav = "aerialnav.tasks"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.11"]

[tool.uv]
index-strategy = "unsafe-best-match"
prerelease = "allow"
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
override-dependencies = [
  "numpy>=2", "mujoco~=3.12.0", "mujoco-warp~=3.12.0", "newton[sim]==1.6.1",
  "newton-usd-schemas>=0.5.0", "usd-exchange==3.0.1", "usd-optimize~=1.3.1",
  "torch==2.11.0", "torchvision==0.26.0", "fsspec>=2026.6.0",
  "hf-xet!=1.8.0.dev0", "packaging>=20,<27", "urllib3>=2.8.0",
]

[tool.uv.sources]
nvidia-curobo = { git = "https://github.com/NVlabs/curobo", rev = "78fd485fa82d9b9a063fb4985e371814587e666a" }
isaaclab = { index = "nvidia" }
omniverseclient = { index = "pypi-public" }
ovphysx = { index = "pypi-public" }
ovrtx = { index = "pypi-public" }
ovstage = { index = "pypi-public" }
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[tool.uv.build-backend]
module-name = "aerialnav"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = ["integration: launches Isaac Sim"]

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"
explicit = false

[[tool.uv.index]]
name = "pypi-public"
url = "https://pypi.org/simple"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
